apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: gomplate
  title: Gomplate (Catalog Template Renderer)
  description: hairyhenderson/gomplate 的 Alauda fork。在 catalog 仓库中根据模板渲染产品化 Tekton Task，仅开发阶段使用，渲染产物才进入产品。
  tags:
    - dev-tool
    - internal-tool
    - template
    - go
  links:
    - url: https://github.com/AlaudaDevops/gomplate
      title: GitHub Repository
      icon: github
    - url: https://github.com/hairyhenderson/gomplate
      title: Upstream Repository
      icon: github
  annotations:
    # github plugin
    github.com/project-slug: AlaudaDevops/gomplate
    # backstage techdocs plugin — dir:../ points to the repo root from .catalog/
    backstage.io/techdocs-ref: dir:../
    acp.cpaas.io/owner: mingfu@alauda.io
    # internal — used only during development, not shipped to customers
    acp.cpaas.io/functional-attributes: internal
    # upstream open-source component info
    acp.cpaas.io/open-source-component-repo: https://github.com/hairyhenderson/gomplate
    acp.cpaas.io/open-source-component-license: MIT
    acp.cpaas.io/open-source-component-license_url: https://github.com/hairyhenderson/gomplate/blob/main/LICENSE

spec:
  type: tool
  system: system:alauda-devops-internal
  lifecycle: experimental
  owner: devops
